<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Fits the screen, stops pinch-zoom so little fingers don't zoom by accident -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#6c5ce7">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Reading Stars</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- Andika is a font made for kids learning to read (simple "a" and "g", like school print) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Everything the child sees is drawn inside here by js/main.js -->
  <main id="app">
    <p class="loading">⭐</p>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
